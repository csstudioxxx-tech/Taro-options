<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jiro-Polaris｜アイ・ボヤージ</title>
<style>
:root{--navy:#1a3d6b;--gold:#f4c430;--bd:#e6e8ec;--sub:#6a7686;--tert:#9aa2ad}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;margin:0;background:#f7f8fa;color:#1f2937}
.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--bd);padding:12px 18px;z-index:50}
.ttl{font-size:17px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ttl .sub{font-size:11px;font-weight:400;color:var(--sub)}
.back{font-size:12px;color:var(--sub);text-decoration:none;border:1px solid var(--bd);padding:3px 10px;border-radius:8px}
.back:hover{background:#f1f2f4}
.sync{font-size:11px;color:var(--tert);margin-left:auto}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.ctrls select,.ctrls input{font:inherit;font-size:12px;padding:6px 9px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:#1f2937}
.ctrls input{width:150px}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;font-size:11px;align-items:center}
.sumchip{padding:2px 9px;border-radius:999px;background:#eef0f2;color:var(--sub)}
.sumchip b{color:#1f2937}
.wrap{padding:14px 18px 70px;max-width:1100px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
th{font-size:10px;color:var(--tert);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;background:#fafbfc}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--sub)}
th .ar{margin-left:3px;color:var(--navy)}
td{padding:8px 10px;border-bottom:1px solid #f0f1f3;font-size:13px;vertical-align:middle}
tr:hover td{background:#fafbfc}
.stn{font-weight:600;white-space:nowrap}
.line{font-size:10px;color:var(--tert)}
.gb{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px}
.gv{font-size:11px;color:var(--sub);margin-left:5px}
.nd{color:var(--tert)}
.rent,.lc{font-variant-numeric:tabular-nums}
.bd2{font-size:11px;line-height:1.7;white-space:nowrap;color:#1f2937}
.bdsrc{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:4px;font-size:8px;font-weight:600;margin-right:3px;vertical-align:1px}
.bdsrc.r{background:#E3F3EC;color:#1F9266}.bdsrc.a{background:#FBE9E9;color:#D85A52}
.bdnum{color:var(--sub)}
.prseg{display:inline-flex;gap:3px}
.prbtn{width:22px;height:25px;border:1px solid var(--bd);background:#fff;border-radius:7px;font-size:11px;font-weight:700;color:#c2c7cf;cursor:pointer;padding:0}
.prbtn:hover{border-color:#b9bec6;color:var(--sub)}
.prbtn.active[data-l="S"]{background:var(--navy);border-color:var(--navy);color:#fff}
.prbtn.active[data-l="A"]{background:#2e9e6b;border-color:#2e9e6b;color:#fff}
.prbtn.active[data-l="B"]{background:var(--gold);border-color:var(--gold);color:#5c4a00}
.prbtn.active[data-l="C"]{background:#8a93a0;border-color:#8a93a0;color:#fff}
.prbtn.active[data-l="D"]{background:#d4d8de;border-color:#d4d8de;color:#3f4651}
.empty{text-align:center;color:var(--tert);padding:30px;font-size:13px}
.ctrls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-start}
.cg{display:flex;flex-direction:column;gap:5px}
.cg .lab{font-size:9px;font-weight:600;color:var(--tert);letter-spacing:.06em}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:5px 11px;font:inherit;font-size:12px;color:var(--sub);cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:#c9ccd2;color:#1f2937}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.rng{display:inline-flex;align-items:center;gap:5px}
.rng input{width:62px;font:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:#1f2937;-moz-appearance:textfield}
.rng input::-webkit-outer-spin-button,.rng input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rng .tilde{color:var(--tert);font-size:12px}
.memoin{width:150px;border:1px solid transparent;background:transparent;font:inherit;font-size:12px;color:#1f2937;padding:4px 7px;border-radius:7px}
.memoin::placeholder{color:#c7ccd3}.memoin:hover{background:#f3f4f6}
.memoin:focus{outline:none;background:#fff;border-color:var(--bd);box-shadow:0 0 0 2px rgba(26,61,107,.12)}
.memoin.set{background:#fffdf5;border-color:#efe6c2}
.hmono{display:flex;align-items:center;gap:13px}
.hbadge{width:38px;height:38px;border-radius:11px;background:#1a3d6b;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 2px 6px rgba(26,61,107,.25)}
.hcol{display:flex;flex-direction:column;gap:1px;min-width:0}
.htt{font-size:18px;font-weight:700;color:#1a3d6b;line-height:1.15}
.hsb{font-size:11px;color:var(--sub)}
.hbtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#1a3d6b;text-decoration:none;border:1px solid #d8dee8;background:#f6f8fb;padding:6px 13px;border-radius:9px;font-weight:500;white-space:nowrap}
.hbtn:hover{background:#eef2f7}
.sync2{font-size:11px;color:var(--sub);margin-left:6px}
.hbadge-red{background:#C0392B;box-shadow:0 2px 6px rgba(192,57,43,.28)}
</style></head><body>

   <div class="cg"><span class="lab">間取り</span><div class="chips" id="cCat"><button class="chip" onclick="toggleChip(this,'cat','シングル')">シングル</button><button class="chip" onclick="toggleChip(this,'cat','カップル')">カップル</button><button class="chip" onclick="toggleChip(this,'cat','ファミリー')">ファミリー</button></div></div>
   <div class="cg"><span class="lab">距離</span><div class="chips" id="cDist"><button class="chip" onclick="toggleChip(this,'dist','near')"><span class="dot" style="background:#1a1a1a"></span>〜30分</button><button class="chip" onclick="toggleChip(this,'dist','mid')"><span class="dot" style="background:#188038"></span>30分前後</button><button class="chip" onclick="toggleChip(this,'dist','far')"><span class="dot" style="background:#0070C0"></span>30分以上</button></div></div>
   <div class="cg"><span class="lab">賃料(万)</span><div class="rng"><input type="number" id="rMin" placeholder="下限" oninput="onCtrl()"><span class="tilde">〜</span><input type="number" id="rMax" placeholder="上限" oninput="onCtrl()"></div></div>
   <div class="cg"><span class="lab">掲載数</span><div class="rng"><input type="number" id="lMin" placeholder="下限" oninput="onCtrl()"><span class="tilde">〜</span><input type="number" id="lMax" placeholder="上限" oninput="onCtrl()"></div></div>
   <div class="cg"><span class="lab">物出し</span><select id="bdF" onchange="onCtrl()"><option value="all">全て</option><option value="has">物出しあり</option><option value="none">物出しなし</option><option value="2w">2週間以上経過</option><option value="1m">1ヶ月以上経過</option></select></div>
   <div class="cg"><span class="lab">優先度</span><select id="fPri" onchange="onCtrl()"><option value="all">全て</option><option value="unset">未設定のみ</option><option value="S">S</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></div>
   <div class="cg"><span class="lab">検索</span><input id="fSearch" type="text" placeholder="駅・沿線" oninput="onCtrl()"></div>
 </div>
 <div class="sum" id="sum"></div>
</div>

function pushMemo(k){if(!GAS_URL||GAS_URL.indexOf('script.google.com')<0)return;setSync('保存中…');fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:'MX__'+k,d:MEMO[k]||'',n:''})}).then(function(){setSync('共有保存OK');}).catch(function(){setSync('保存失敗(通信)');});}
function toggleChip(el,grp,val){var set=grp==='pref'?selPref:grp==='cat'?selCat:selDist;if(set.has(val)){set.delete(val);el.classList.remove('on');}else{set.add(val);el.classList.add('on');}render();}
function distKey(d){return d.nc==='G'?'mid':d.nc==='B'?'far':'near';}
function hasBd(d){var v=BV[key(d)]||{};return !!(v.rd||v.ad);}
function bdAgeDays(d){var v=BV[key(d)]||{};var t=v.rd||v.ad||'';if(!t)return -1;var p=String(t).split('/');var m=parseInt(p[0],10),day=parseInt(p[1],10);if(!m||!day)return -1;var now=new Date();var dt=new Date(now.getFullYear(),m-1,day);var diff=Math.floor((now-dt)/86400000);if(diff<-1)diff+=365;return diff;}
var selPref=new Set(),selCat=new Set(),selDist=new Set();
var rentMin=null,rentMax=null,lcMin=null,lcMax=null,bdF='all',fPri='all',fSearch='';
var sortCol='rank',sortDir='asc';
function key(d){return d.pref+'|'+d.cat+'|'+d.st;}
function setSync(t){var e=document.getElementById('sync');if(e)e.textContent=t;}
function priRank(l){return {S:5,A:4,B:3,C:2,D:1}[l]||0;}
function mdnum(s){if(!s)return 0;var p=String(s).split('/');return (parseInt(p[0],10)||0)*100+(parseInt(p[1],10)||0);}
function bdLatest(d){var v=BV[key(d)]||{};return Math.max(mdnum(v.rd),mdnum(v.ad));}
function gbadge(d){if(!d.hasd||d.gr==null)return '<span class="nd">—</span>';var bg={S:'#f4c430',A:'#fbf3d5',B:'#eaf1f9',C:'#eef0f2'}[d.gr],fg=d.gr==='S'?'#5c4a00':(d.gr==='C'?'#6a7686':'#1a3d6b');return '<span class="gb" style="background:'+bg+';color:'+fg+'">'+d.gr+'</span><span class="gv">'+d.gsc+'</span>';}
function priButtons(d){var k=key(d),cur=PR[k]||'';var L=['S','A','B','C','D'],h='<div class="prseg">';L.forEach(function(l){h+='<button type="button" class="prbtn'+(cur===l?' active':'')+'" data-l="'+l+'" onclick="setPriority(\''+k+'\',\''+l+'\')">'+l+'</button>';});return h+'</div>';}
function bdCell(d){var v=BV[key(d)]||{};function ln(cls,lab,dt,nm){if(!dt&&!nm)return '';return '<span class="bdsrc '+cls+'">'+lab+'</span>'+(dt||'—')+(nm?(' <span class="bdnum">'+nm+'</span>'):'');}var R=ln('r','R',v.rd,v.rn),A=ln('a','A',v.ad,v.an);if(!R&&!A)return '<span class="nd">—</span>';return R+(R&&A?'<br>':'')+A;}
function setPriority(k,l){if(PR[k]===l)delete PR[k];else PR[k]=l;try{localStorage.setItem('aivoyage_priority',JSON.stringify(PR));}catch(e){}pushPri(k);render();}
function pushPri(k){if(!GAS_URL||GAS_URL.indexOf('script.google.com')<0)return;setSync('保存中…');fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:'PR__'+k,d:PR[k]||'',n:''})}).then(function(){setSync('共有保存OK');}).catch(function(){setSync('保存失敗(通信)');});}
function onCtrl(){function num(id){var v=document.getElementById(id).value;return v===''?null:parseFloat(v);}rentMin=num('rMin');rentMax=num('rMax');lcMin=num('lMin');lcMax=num('lMax');bdF=document.getElementById('bdF').value;fPri=document.getElementById('fPri').value;fSearch=document.getElementById('fSearch').value.trim();render();}
function setSort(col){var def={rank:'asc',rent:'desc',gap:'desc',listing:'desc',bd:'desc',pri:'desc'};if(sortCol===col){sortDir=sortDir==='asc'?'desc':'asc';}else{sortCol=col;sortDir=def[col]||'asc';}render();}
function cmp(a,b){var dir=sortDir==='asc'?1:-1,va,vb;switch(sortCol){case 'pri':va=priRank(PR[key(a)]);vb=priRank(PR[key(b)]);break;case 'rent':va=(a.k==null?-1:a.k);vb=(b.k==null?-1:b.k);break;case 'gap':va=(a.hasd&&a.gsc!=null)?a.gsc:-1;vb=(b.hasd&&b.gsc!=null)?b.gsc:-1;break;case 'listing':va=LC[a.cat+'|'+a.st]||0;vb=LC[b.cat+'|'+b.st]||0;break;case 'bd':va=bdLatest(a);vb=bdLatest(b);break;default:va=a.rank;vb=b.rank;}if(va<vb)return -1*dir;if(va>vb)return 1*dir;return a.rank-b.rank;}
function render(){
 var rows=DATA.filter(function(d){
   if(selPref.size&&!selPref.has(d.pref))return false;
   if(selCat.size&&!selCat.has(d.cat))return false;
   if(selDist.size&&!selDist.has(distKey(d)))return false;
   if(rentMin!=null&&(d.k==null||d.k<rentMin))return false;
   if(rentMax!=null&&(d.k==null||d.k>rentMax))return false;
   var lk=LC[d.cat+'|'+d.st]||0;
   if(lcMin!=null&&lk<lcMin)return false;
   if(lcMax!=null&&lk>lcMax)return false;
   if(bdF!=='all'){var hb=hasBd(d),age=bdAgeDays(d);if(bdF==='has'&&!hb)return false;if(bdF==='none'&&hb)return false;if(bdF==='2w'&&!(hb&&age>=14))return false;if(bdF==='1m'&&!(hb&&age>=30))return false;}
   var p=PR[key(d)]||'';
   if(fPri==='unset'){if(p)return false;}else if(fPri!=='all'){if(p!==fPri)return false;}
   if(fSearch){if(d.st.indexOf(fSearch)<0&&(d.line||'').indexOf(fSearch)<0)return false;}
   return true;
 });
 rows.sort(cmp);
 var tb=document.getElementById('tb');
 if(!rows.length){tb.innerHTML='<tr><td colspan="9" class="empty">該当する物件がありません</td></tr>';}
 else{var h='';rows.forEach(function(d){var lk=LC[d.cat+'|'+d.st];
   h+='<tr>'
    +'<td>'+priButtons(d)+'</td>'
    +'<td>'+d.rank+'</td>'
    +'<td><span class="stn">'+d.st+'</span><br><span class="line">'+(d.line||'')+'</span></td>'
    +'<td>'+d.cat+'</td>'
    +'<td class="rent">'+(d.k!=null?(d.k+'<span style="font-size:10px;color:var(--tert)">万</span>'):'<span class="nd">—</span>')+'</td>'
    +'<td>'+gbadge(d)+'</td>'
    +'<td class="lc">'+(lk!=null?lk:'<span class="nd">—</span>')+'</td>'
    +'<td class="bd2">'+bdCell(d)+'</td>'
    +'<td><input type="text" class="memoin'+(mget(key(d))?' set':'')+'" data-k="'+key(d)+'" value="'+esc(mget(key(d)))+'" onchange="setMemo(this)"></td>'
   +'</tr>';});tb.innerHTML=h;}
 var cnt={S:0,A:0,B:0,C:0,D:0,unset:0};rows.forEach(function(d){var p=PR[key(d)]||'';if(p)cnt[p]++;else cnt.unset++;});
 document.getElementById('sum').innerHTML='<span class="sumchip">計 <b>'+rows.length+'</b> 件</span>'
   +'<span class="sumchip">S <b>'+cnt.S+'</b></span><span class="sumchip">A <b>'+cnt.A+'</b></span><span class="sumchip">B <b>'+cnt.B+'</b></span><span class="sumchip">C <b>'+cnt.C+'</b></span><span class="sumchip">D <b>'+cnt.D+'</b></span><span class="sumchip">未設定 <b>'+cnt.unset+'</b></span>';
 ['pri','rank','rent','gap','listing','bd'].forEach(function(c){var e=document.getElementById('ar_'+c);if(e)e.textContent=(sortCol===c)?(sortDir==='asc'?'▲':'▼'):'';});
}
function load(){
 setSync('読込中…');
 fetch(GAS_URL).then(function(r){return r.json();}).then(function(o){
   if(o&&typeof o==='object'){Object.keys(o).forEach(function(k){var rec=o[k];if(!rec)return;
     if(k.indexOf('MX__')===0){if(rec.d)MEMO[k.slice(4)]=rec.d;}else if(k.indexOf('PR__')===0){if(rec.d)PR[k.slice(4)]=rec.d;else delete PR[k.slice(4)];}
     else if(k!=='__LC__'){try{var pv=JSON.parse(rec.d||'');if(pv&&typeof pv==='object')BV[k]=pv;}catch(e){}}
   });}
   try{localStorage.setItem('aivoyage_priority',JSON.stringify(PR));}catch(e){}
   setSync('');render();
 }).catch(function(){setSync('共有DB取得失敗');render();});
 fetch(NYUKOU_API).then(function(r){return r.json();}).then(function(db){
   var props=(db&&db.props)||[],cnt={};props.forEach(function(p){if(p.status!=='掲載中')return;var st=(p.station||'').trim();if(!st)return;var c=madoriToCat(p.madori||'');cnt[c+'|'+st]=(cnt[c+'|'+st]||0)+1;});LC=cnt;render();
 }).catch(function(){});
}
render();
load();
</script></body></html>
